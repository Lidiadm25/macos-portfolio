

<header
  class="h-7 w-full bg-slate-900/40 backdrop-blur-md border-b border-white/10 text-slate-200 text-xs px-3 flex items-center justify-between select-none z-50 fixed top-0 left-0">
  <div class="flex items-center gap-4">
    <img 
    src="assets/images/apple-logo-svgrepo-com.svg" 
    alt="Apple Logo" 
    class="w-3.5 h-3.5 object-contain brightness-0 invert" 
  />

    <span class="font-semibold text-white">{{ 'TOPBAR.FINDER' | translate }}</span>
    <nav class="hidden sm:flex items-center gap-3 text-slate-300">
      <span class="hover:text-white cursor-pointer">{{ 'TOPBAR.FILE' | translate }}</span>
      <span class="hover:text-white cursor-pointer">{{ 'TOPBAR.EDIT' | translate }}</span>
      <span class="hover:text-white cursor-pointer">{{ 'TOPBAR.VIEW' | translate }}</span>
      <span class="hover:text-white cursor-pointer">{{ 'TOPBAR.WINDOW' | translate }}</span>
      <span class="hover:text-white cursor-pointer">{{ 'TOPBAR.HELP' | translate }}</span>
    </nav>
  </div>

  <div class="flex items-center gap-3">
    <button (click)="toggleLanguage()"
      class="px-1.5 py-0.5 rounded bg-white/10 hover:bg-white/20 text-[11px] font-semibold tracking-wider transition-colors">
      {{ currentLang().toUpperCase() }}
    </button>



    <svg lucideBattery width="18" height="18" stroke-width="2"></svg>

    <svg lucideWifi width="18" height="18"></svg>



    <span class="font-medium text-slate-100">
      {{ currentTime() | date:'EEE d MMM HH:mm' }}
    </span>
  </div>
</header>
